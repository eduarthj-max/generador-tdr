services:
  - type: web
    name: generador-tdr
    runtime: docker
    plan: starter # el disco persistente requiere un plan de pago
    healthCheckPath: /api/salud
    disk:
      name: referencias
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: CLAUDE_EFFORT
        value: high
      - key: DATA_DIR
        value: /app/data
